name: Tests

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read
  # codecov/codecov-action still requests an OIDC token; harmless to keep.
  # The upload itself needs CODECOV_TOKEN — see the coverage job.
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.2"

jobs:
  shard-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          declare -a SHARDS=(
            test/data
            test/domain
            test/gateway
            test/features
            test/integration
            test/common
            test/core
            test/mesh
            test/surrounding
            test/widget_test.dart
            test/shiv_home_page_test.dart
            test/expandable_note_text_tap_test.dart
            test/llm_text_sanitizer_test.dart
          )
          regex=""
          for p in "${SHARDS[@]}"; do
            esc=$(echo "$p" | sed 's|/|\\/|g')
            regex="${regex:+$regex|}^$esc"
          done
          missing=$(find test -name '*_test.dart' -not -path 'test/_helpers/*' \
            | grep -vE "$regex" || true)
          if [ -n "$missing" ]; then
            echo "::error::Test files not covered by any shard:"
            echo "$missing"
            exit 1
          fi
          echo "All test files covered."

  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}

      - uses: actions/cache@v4
        with:
          path: ~/.cache/flutter_gemma
          key: gemma-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}

      - uses: actions/cache@v4
        id: codegen
        with:
          path: |
            .dart_tool
            lib/**/*.g.dart
            lib/**/*.freezed.dart
          key: codegen-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'lib/**/*.dart', '!lib/**/*.g.dart', '!lib/**/*.freezed.dart') }}

      - if: steps.codegen.outputs.cache-hit != 'true'
        run: flutter pub get

      - if: steps.codegen.outputs.cache-hit != 'true'
        run: flutter pub run build_runner build --delete-conflicting-outputs

  analyze:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
      - uses: actions/cache@v4
        with:
          path: |
            .dart_tool
            lib/**/*.g.dart
            lib/**/*.freezed.dart
          key: codegen-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'lib/**/*.dart', '!lib/**/*.g.dart', '!lib/**/*.freezed.dart') }}
      - run: flutter pub get --offline
      - run: flutter analyze --no-fatal-infos lib/ test/ integration_test/

  test:
    name: ${{ matrix.shard.name }}
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        shard:
          # concurrency=1 on Isar-native-binary shards; parallel isolates SIGBUS on the second loader.
          - name: data
            paths: test/data
            concurrency: 1
          - name: domain
            paths: test/domain
            concurrency: 4
          - name: gateway
            paths: test/gateway
            concurrency: 1
          - name: features
            paths: test/features
            concurrency: 4
          - name: integration
            paths: test/integration
            concurrency: 1
          - name: common
            paths: test/common test/widget_test.dart test/shiv_home_page_test.dart test/expandable_note_text_tap_test.dart test/llm_text_sanitizer_test.dart
            concurrency: 4
          - name: core
            paths: test/core
            concurrency: 4
          - name: mesh
            paths: test/mesh test/surrounding
            concurrency: 4
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}

      - uses: actions/cache@v4
        with:
          path: ~/.cache/flutter_gemma
          key: gemma-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}

      - uses: actions/cache@v4
        with:
          path: |
            .dart_tool
            lib/**/*.g.dart
            lib/**/*.freezed.dart
          key: codegen-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'lib/**/*.dart', '!lib/**/*.g.dart', '!lib/**/*.freezed.dart') }}

      - run: flutter pub get --offline

      - name: Run tests
        run: |
          set -e
          existing=""
          for p in ${{ matrix.shard.paths }}; do
            [ -e "$p" ] && existing="$existing $p"
          done
          if [ -z "$existing" ]; then
            echo "::notice::No tests for ${{ matrix.shard.name }} yet."
            exit 0
          fi
          flutter test --coverage --reporter expanded \
            --concurrency=${{ matrix.shard.concurrency }} \
            $existing

      - name: Upload shard coverage
        if: hashFiles('coverage/lcov.info') != ''
        uses: actions/upload-artifact@v4
        with:
          name: lcov-${{ matrix.shard.name }}
          path: coverage/lcov.info
          retention-days: 3

  coverage:
    runs-on: ubuntu-latest
    needs: test
    if: always() && needs.test.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: lcov-*
          path: shard-coverage

      - name: Merge shard coverage
        run: |
          set -e
          sudo apt-get install -y -qq lcov > /dev/null
          args=""
          for f in shard-coverage/lcov-*/lcov.info; do
            [ -s "$f" ] && args="$args -a $f"
          done
          if [ -z "$args" ]; then
            echo "::error::No shard coverage artifacts found"
            exit 1
          fi
          lcov $args -o merged.info --ignore-errors inconsistent,corrupt
          # Generated code is noise, not coverage debt.
          lcov --remove merged.info '*.g.dart' '*.freezed.dart' '*/l10n/*' \
            -o coverage.info --ignore-errors unused,inconsistent
          hit=$(awk -F: '/^LH:/ { s+=$2 } END { print s+0 }' coverage.info)
          lines=$(awk -F: '/^LF:/ { s+=$2 } END { print s+0 }' coverage.info)
          files=$(grep -c '^SF:' coverage.info || true)
          pct=$(awk -v h="$hit" -v l="$lines" 'BEGIN { printf "%.1f", l ? (h*100)/l : 0 }')
          echo "::notice::Coverage: $pct% ($hit / $lines lines, $files files)"
          {
            echo "COVERAGE_PCT=$pct"
            echo "COVERAGE_HIT=$hit"
            echo "COVERAGE_LINES=$lines"
            echo "COVERAGE_FILES=$files"
          } >> "$GITHUB_ENV"
          {
            echo "## Coverage"
            echo ""
            echo "**$pct%** — $hit of $lines lines, across $files files"
          } >> "$GITHUB_STEP_SUMMARY"

      # Uploads to Codecov for the PR/main-branch coverage dashboard, patch
      # (diff) coverage, and trend graphs. This repo is PRIVATE, so the
      # tokenless OIDC path does not apply — Codecov answers
      # "Token required - not valid tokenless upload" and the dashboard stays
      # empty. It needs a CODECOV_TOKEN repo secret (Codecov → repo settings →
      # upload token). Without it the step still passes: `fail_ci_if_error:
      # false`, and the percentage is printed in the job summary regardless.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage.info
          retention-days: 14

  tests-passed:
    name: tests
    runs-on: ubuntu-latest
    needs: [shard-coverage, analyze, test]
    if: always()
    steps:
      - run: |
          if [ "${{ needs.shard-coverage.result }}" != "success" ] || \
             [ "${{ needs.analyze.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::A required job failed."
            exit 1
          fi
          echo "All checks passed."
