name: uniun
description: "UNIUN — decentralized offline-first social and knowledge network on Nostr."
publish_to: "none"
version: 3.0.0+18

environment:
  sdk: ">=3.12.0 <4.0.0"

global_options:
  freezed:freezed:
    runs_before:
      - isar_generator:isar_generator

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.2
  go_router: ^14.0.0
  flutter_bloc: ^8.1.3
  bloc: ^8.1.2
  bloc_concurrency: ^0.2.4
  injectable: ^2.3.2
  get_it: ^8.0.0
  freezed_annotation: ^3.0.0
  isar_community: 3.3.2
  isar_community_flutter_libs: 3.3.2
  dartz: ^0.10.1
  path_provider: ^2.0.15
  path: ^1.9.0
  web_socket_channel: ^3.0.3
  convert: ^3.1.2
  crypto: ^3.0.7
  # Zone-scoped clock for InferenceScheduler's vruntime/T2-budget timing —
  # makes `clock.now()` fakeable via `package:fake_async` in tests, unlike
  # a raw `Stopwatch` (which fake_async cannot fake).
  clock: ^1.1.2
  # HKDF + ChaCha20-Poly1305 for the same-identity mesh channel encryption
  # (already in the tree transitively; declared here since we import it directly).
  cryptography_plus: ^2.7.1
  # secp256k1 ECDH point multiplication for decrypting the gateway's
  # `encrypted_api_key` (already in the tree transitively via bip340;
  # declared here since we import it directly).
  pointycastle: ^3.9.1
  nostr: ^1.4.0
  nostr_core_dart: ^1.0.1
  json_annotation: ^4.9.0
  flutter_secure_storage: any
  shared_preferences: ^2.2.2
  avatar_plus: ^0.0.5
  cached_network_image: ^3.3.1
  image_picker: ^1.2.1
  flutter_native_splash: ^2.3.10
  qr_flutter: ^4.1.0
  share_plus: ^10.1.4
  # Inbound share: lets other apps (WhatsApp, Photos, Files, browsers) push
  # text/links/images/videos/files INTO UNIUN via the OS share sheet. Android
  # reads ACTION_SEND off the singleTop MainActivity; iOS needs a Share
  # Extension target + App Group (group.in.uniun.app) — see ios/ShareExtension/.
  receive_sharing_intent: ^1.8.1
  # Direct save to Photos / Files (Android / iOS / macOS). On Windows we
  # fall back to copying the file to the user's Downloads directory via
  # path_provider.
  image_gallery_saver_plus: ^5.0.0
  mobile_scanner: ^7.2.0
  # flutter_gemma 1.x splits the monolith into a small core + opt-in engine
  # packages. We ship both .task models (MediaPipe) and .litertlm models
  # (LiteRT-LM), plus the embedder used by Shiv RAG. Vector store stays
  # tostore (we keep our own RAG path; no qdrant sub-package).
  flutter_gemma: ^1.8.3
  flutter_gemma_litertlm: ^1.6.3
  flutter_gemma_mediapipe: ^1.0.6
  flutter_gemma_embeddings: ^2.1.1
  # Background execution. Used by GanaBootstrap to schedule one-shot Gana
  # ticks when the app is backgrounded. Foreground engine uses the
  # long-lived isolate; WorkManager only runs when the app is paused.
  workmanager: ^0.9.0
  system_info_plus: ^0.0.6
  # Reads the real app version/build (baked from this pubspec's `version:`)
  # at runtime for the Settings → About row.
  package_info_plus: ^8.0.0
  openmls: ^1.3.0
  http: ^1.4.0
  uuid: ^4.5.1
  graphview: ^1.5.1
  flutter_keyboard_visibility: ^6.0.0
  nip44:
    git:
      url: https://github.com/chebizarro/dart-nip44.git
      ref: master
  disk_space_plus: ^0.2.6
  nip77: ^1.0.1
  flutter_svg: ^2.2.4
  # 3.1.2, not 3.1.0: 3.1.0 declares struct statvfs as 88 bytes where glibc
  # and 64-bit bionic use 112, so every disk-space check overflowed the heap
  # by 24 bytes (random malloc aborts on Linux; Android shares the code path).
  # Reads 3.1.0 stores unchanged. 3.1.1/3.1.3 are retracted; 3.5.x changes
  # both the API and the on-disk format (#232).
  tostore: ^3.1.2
  visibility_detector: ^0.4.0+2
  flutter_markdown_plus: ^1.0.3
  markdown: ^7.3.0
  url_launcher: ^6.3.0
  flutter_blurhash: ^0.9.1
  # Blurhash ENCODER (flutter_blurhash only decodes). Needs the `image`
  # package to decode/resize before encoding — both used by
  # core/utils/media_blurhash.dart in a compute() isolate.
  blurhash_dart: ^1.2.1
  image: ^4.8.0
  mime: ^2.0.0
  file_picker: ^8.1.4
  # SAF "Save as" picker on Android, "Save to Files" on iOS.
  # Android+iOS only — desktop save path goes through file_picker.saveFile().
  flutter_file_dialog: ^3.0.2
  # No Windows backend; ImageCompressor short-circuits on Windows.
  flutter_image_compress: ^2.3.0
  open_filex: ^4.5.0
  # No Windows backend; VideoCompressor short-circuits on Windows.
  video_compress: ^3.1.4
  bonsoir: ^5.1.0
  # Triggers a LAN-transport rebind when the network interface changes (Wi-Fi
  # switch) so mesh sync recovers without an app restart — see MeshEngineHost.
  connectivity_plus: ^6.1.0
  pdfrx: ^2.4.8
  # DOCX text for Shiv's RAG: a .docx is a zip around word/document.xml.
  # Imported only by lib/data/datasources/docx/docx_text_source.dart. Also
  # unpacks the PDFium prebuilt in test/_helpers/pdfium_test_lib.dart.
  archive: ^4.0.0
  xml: ^6.6.1
  # On-device OCR for Shiv's image search. Imported only by
  # lib/data/datasources/ocr/ocr_text_source.dart. Devanagari needs its own
  # native dependency — see android/app/build.gradle.kts and ios/Podfile.
  google_mlkit_text_recognition: ^0.17.1
  # On-device labels ("dog", "food") for Shiv's image search. Imported only by
  # lib/data/datasources/image_labels/image_label_source.dart. Its Firebase
  # dependency is excluded in android/app/build.gradle.kts — see CLAUDE.md.
  google_mlkit_image_labeling: ^0.16.1
  ffi: ^2.2.0
  pdfium_dart: ^0.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  # Direct dev import so tests can BIP-340-verify what UniunCloudAuth signs
  # (runtime version pinned by the dependency_overrides entry below).
  bip340: ^0.2.0

  # Industry-standard BLoC testing helper. `blocTest()` gives the
  # declarative `act/expect/verify` style instead of hand-rolled
  # `await bloc.stream.firstWhere(...)` loops.
  bloc_test: ^9.1.7
  # Mocktail: null-safety-native mock library, no codegen, no
  # mockito @GenerateMocks boilerplate. Companion to bloc_test.
  mocktail: ^1.0.4
  # Virtualizes Timer/Duration and package:clock's clock.now() inside a
  # synchronous callback — used to test InferenceScheduler's 5-minute
  # vruntime decay and T2 budget window without real waits. Already
  # resolves transitively via flutter_test; declared directly since we
  # import it in test code.
  fake_async: ^1.3.1
  # Direct deps for test/_helpers/fake_path_provider.dart (platform-interface
  # fakes). Both already resolve transitively via path_provider; declaring
  # them keeps depend_on_referenced_packages honest.
  path_provider_platform_interface: ^2.1.0
  plugin_platform_interface: ^2.1.0

  flutter_lints: ^2.0.0
  build_runner: ^2.13.0
  freezed: ^3.0.0
  isar_community_generator: 3.3.2
  injectable_generator: ^2.4.1
  json_serializable: ^6.9.0
  flutter_launcher_icons: ^0.14.3

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/uniun-logo.png

  android_12:
    image: assets/images/uniun-logo-android12.png
    color: "#ffffff"

  ios: true
  ios_content_mode: center
  android_gravity: center

  web: false

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/uniun-logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/uniun-logo.png"

# nostr_core_dart pins http ^0.13.3; flutter_gemma needs ^1.4.0. Safe — nostr_core_dart only calls http.get().
# hooks: flutter_gemma needs ^2.0.0, openmls pins ^1.0.0. Safe — openmls uses no 2.x-broken APIs.
dependency_overrides:
  http: ^1.4.0
  hooks: ^2.0.0
  # path_provider_foundation 2.6+ (objective_c/FFI) crashes off-main-isolate on iOS/macOS. Pin to last Pigeon-based release.
  path_provider_foundation: 2.5.1
  # bip340 0.1.0 (nostr_core_dart's pin) emits unpadded sigs, ~1/128 fail verification. Fixed in 0.2.0.
  bip340: ^0.2.0
  # background_downloader 9.5.7 (flutter_gemma's download engine) breaks the Android Kotlin build here. Pin to 9.5.6.
  background_downloader: 9.5.6

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/tabs/
    - assets/models/embedding/

  fonts:
    # Newsreader — humanist display serif (design-system --font-display).
    # Used sparingly for brand/onboarding headlines only. Variable font
    # (weight + optical-size axes); weights are selected via fontVariations.
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader.ttf
